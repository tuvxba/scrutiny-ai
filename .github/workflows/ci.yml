name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scrutinyai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scrutinyai -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-only-dummy-secret-at-least-32-characters-long
      AI_API_KEY: dummy

    steps:
      - name: Kodu indir
        uses: actions/checkout@v7

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Derle ve test et
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  docker:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Kodu indir
        uses: actions/checkout@v7

      - name: GHCR'ye giriş yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image'ı üret ve gönder
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}