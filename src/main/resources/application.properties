spring.application.name=scrutiny-ai
spring.datasource.url=jdbc:postgresql://localhost:5432/scrutinyai
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

ai.api-key=${AI_API_KEY}
ai.base-url=https://generativelanguage.googleapis.com/v1beta
ai.model=gemini-3.1-flash-lite

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=scrutiny-ai-review-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.scrutinyai.kafka